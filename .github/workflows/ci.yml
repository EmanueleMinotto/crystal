name: Continuous Integration

on:
    - pull_request
    - push

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php:
                    [
                        "5.3",
                        "5.4",
                        "5.5",
                        "5.6",
                        "7.0",
                        "7.1",
                        "7.2",
                        "7.3",
                        "7.4",
                        "8.0",
                        "8.1",
                        "8.2",
                        "8.3",
                        "8.4",
                        "8.5",
                    ]
                extensions: ["apcu"]

        name: PHP ${{ matrix.php }} tests with extensions "${{ matrix.extensions }}"
        steps:
            - uses: actions/checkout@v2

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  extensions: ${{ matrix.extensions }}

            - run: "composer install"
            - run: "composer test"
