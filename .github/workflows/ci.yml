name: Continuous Integration

on:
    - pull_request
    - push

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php:
                    [
                        "7.0",
                        "7.1",
                        "7.2",
                        "7.3",
                        "7.4",
                        "8.0",
                        "8.1",
                        "8.2",
                        "8.3",
                        "8.4",
                        "8.5",
                    ]
                extensions: ["apcu", ""]

        name: PHP ${{ matrix.php }} tests with extensions "${{ matrix.extensions }}"
        steps:
            - uses: actions/checkout@v2

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  extensions: ${{ matrix.extensions }}

            - run: "composer install"
            - run: "composer test"

    mysql-cache:
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: crystal_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3

        name: MySQL cache driver
        steps:
            - uses: actions/checkout@v2

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none
                  extensions: pdo_mysql

            - run: "composer install"
            - run: "composer test"
              env:
                  CRYSTAL_MYSQL_DSN: "mysql:host=127.0.0.1;dbname=crystal_test"
                  CRYSTAL_MYSQL_USER: root
                  CRYSTAL_MYSQL_PASS: root
