name: Continuous Integration

# pull requests are tested once, not for both the push and the pull_request events
on:
    push:
        branches: [master]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # the tests run against crystal.php: it must be built from the src directory
    build:
        runs-on: ubuntu-latest
        name: crystal.php built from src
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none

            - run: "composer install"
            - run: "composer build"
            - name: "Check that crystal.php and the formatting are up to date"
              run: |
                  if ! git diff --exit-code; then
                      echo "::error::Run 'composer build' and commit the changes."
                      exit 1
                  fi

    # every supported PHP version, with the APCu cache driver enabled
    tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php:
                    [
                        "7.0",
                        "7.1",
                        "7.2",
                        "7.3",
                        "7.4",
                        "8.0",
                        "8.1",
                        "8.2",
                        "8.3",
                        "8.4",
                        "8.5",
                    ]

        name: PHP ${{ matrix.php }}
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  extensions: apcu
                  ini-values: apc.enable_cli=1

            - run: "composer install"
            - run: "composer test"

    # databases and cache servers, APCu isn't enabled in the CLI to test the fallback
    # (it can't be removed: the redis and memcached extensions depend on it)
    services:
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: crystal_test
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: crystal_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=3
            redis:
                image: redis:7
                ports:
                    - 6379:6379
            memcached:
                image: memcached:1.6
                ports:
                    - 11211:11211

        name: MySQL, PostgreSQL, Redis, Memcached, APCu disabled
        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  coverage: none
                  extensions: pdo_mysql, pdo_pgsql, redis, memcached

            - run: "composer install"
            - run: "composer test"
              env:
                  CRYSTAL_MYSQL_DSN: "mysql:host=127.0.0.1;dbname=crystal_test"
                  CRYSTAL_MYSQL_USER: root
                  CRYSTAL_MYSQL_PASS: root
                  CRYSTAL_PGSQL_DSN: "pgsql:host=127.0.0.1;dbname=crystal_test"
                  CRYSTAL_PGSQL_USER: postgres
                  CRYSTAL_PGSQL_PASS: postgres
                  CRYSTAL_REDIS_HOST: 127.0.0.1
                  CRYSTAL_MEMCACHED_HOST: 127.0.0.1
